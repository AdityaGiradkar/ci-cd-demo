      # - name: Check files
      #   run: |
      #     pwd
      #     ls -la
      #     find . -name "Dockerfile" -print

      - name: Build Docker image
        run: docker build -t my-react-app:${{ github.sha }} .

      - name: Save Docker image
        run: docker save my-react-app:${{ github.sha }} -o react-app.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: react-docker-image
          path: react-app.tar