name: React CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # # 2. Setup Node.js
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
